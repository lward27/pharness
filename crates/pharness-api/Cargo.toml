[package]
name = "pharness-api"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Compiles deterministic loopback-only provider hooks used by the browser
# acceptance harness. Production images are built without this feature.
ui-e2e = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
futures.workspace = true
globset.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
pharness-core = { path = "../pharness-core" }
pharness-config = { path = "../pharness-config" }
pharness-fireworks = { path = "../pharness-fireworks" }
pharness-openai-compatible = { path = "../pharness-openai-compatible" }
pharness-runhost = { path = "../pharness-runhost" }
pharness-store = { path = "../pharness-store" }
reqwest.workspace = true
ring.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
sqlx.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# Test-only RSA key generation for the RS256 id_token round trip.
rsa = { version = "0.9.10", default-features = false, features = ["std", "getrandom", "u64_digit"] }
tower = { version = "0.5", features = ["util"] }
