[package]
name = "pharness-historical-eval"
version = "0.1.0"
edition = "2021"

# This manifest is copied into a detached historical checkout by
# `scripts/run-historical-baseline.sh`.  Keep its dependencies explicit: the
# package is intentionally outside that checkout's Cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
pharness-core = { path = "../crates/pharness-core" }
pharness-fireworks = { path = "../crates/pharness-fireworks" }
pharness-runhost = { path = "../crates/pharness-runhost" }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
