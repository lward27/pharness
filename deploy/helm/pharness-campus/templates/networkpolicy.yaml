{{- $api := dict "app" "pharness-campus-api" -}}
# Nothing in campus-poc talks to anything unless a policy below says so.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: campus-poc-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pharness-campus.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# The Campus API: browsers through Traefik, lab sessions on the broker port
# only. Out: the Kubernetes API (controller and terminal identities) and the
# Keycloak token and JWKS endpoints. No DNS and no internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-campus-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pharness-campus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $api | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - port: 4777
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.kubernetes.labNamespaceLabel.key }}: {{ .Values.kubernetes.labNamespaceLabel.value | quote }}
      ports:
        - port: {{ .Values.api.broker.port }}
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.kubernetes.apiServerEndpoint.cidr }}
      ports:
        - port: {{ .Values.kubernetes.apiServerEndpoint.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.keycloak.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.keycloak.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.keycloak.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-campus-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pharness-campus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: pharness-campus-ui
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - port: 8080
          protocol: TCP
