nameOverride: pharness

features:
  repoModeV1:
    # Enabled after the release passed isolated source-reader, GitHub-observer,
    # Python runner, and model-provider capability verification.
    enabled: true
    # Full operator-experience cutover. Keep disabled until the complete
    # repository onboarding and Repo Mode WorkItem journey passes.
    uiEnabled: true

organization:
  id: org_lucas_engineering
  key: lucas-engineering
  displayName: Lucas Engineering

# Secrets are created out-of-band, never by this chart:
#   kubectl create secret generic pharness-fireworks \
#     --from-literal=api-key=<fireworks api key> -n pharness
#   kubectl create secret generic pharness-worker-token \
#     --from-literal=token=<random worker token> -n pharness
#   kubectl create secret generic pharness-operator-token \
#     --from-literal=tokens=<name>=<token> \
#     --from-literal=console-token=<token> -n pharness
#   htpasswd basic-auth secret for the console ingress:
#   kubectl create secret generic pharness-console-basic-auth \
#     --from-literal=auth=<htpasswd line> -n pharness

api:
  image:
    repository: registry.lucas.engineering/pharness-runtime
    digest: sha256:e300a83d4cd2cedadbf56102681143f7f2905d2c1e7693d7e339d235dd219094
    pullPolicy: IfNotPresent
    revision: 54688f09812825eacd2e9e522a96a993f5e154f3
  # SQLite single-writer: keep exactly one API replica.
  replicas: 1
  host: pharness-api.lucas.engineering
  dbPath: /data/pharness.db
  operationalMode: normal
  legacyWorkItemCreationEnabled: false
  databaseGeneration:
    id: dbgen_finance_20260827
    purpose: clean-finance-product-generation
    adoptExisting: false
    accepted: false
  persistence:
    create: true
    claimName: pharness-api-data-finance-20260827
    existingClaim: ""
    retain: true
    storageClass: local-path
    size: 2Gi
  fireworksSecretName: pharness-fireworks
  workerTokenSecretName: pharness-worker-token
  operatorTokenSecretName: pharness-operator-token
  model: accounts/fireworks/models/kimi-k2p6
  policy:
    subject: agent:pharness-worker
    environment: homelab
  cluster:
    argocdNamespace: argocd
    prometheusUrl: http://prometheus-server.monitoring.svc.cluster.local:80
    lokiUrl: http://loki.monitoring.svc.cluster.local:3100
    registryAliases: docker-registry.registry.svc.cluster.local:5000=registry.lucas.engineering
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

inferenceGateway:
  enabled: true
  directFireworksEnabled: true
  image:
    repository: registry.lucas.engineering/pharness-model-gateway
    # Disabled until the post-merge release commit pins the gateway built from
    # the same source revision as API, UI, and both runners.
    digest: sha256:c099ef8b3eb2b846b406503ef39ef688072b3fe2c6db8fa34aeeea29877c4583
    pullPolicy: IfNotPresent
    revision: 54688f09812825eacd2e9e522a96a993f5e154f3
  replicas: 1
  grantSecretName: pharness-model-grant-v2
  grantSecretKey: key
  fireworksCredential:
    secretName: pharness-fireworks
    secretKey: api-key
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

retention:
  scheduledEnabled: true
  intervalSeconds: 86400
  automaticExecutionEnabled: true
  previewOnly: false

# A separately retained volume for consistent offline database archives. It is
# tied to the archived generation, not to whichever database generation is
# currently active after cutover.
archivePersistence:
  enabled: true
  claimName: pharness-data-archive-legacy-20260826
  archivedGenerationId: dbgen_legacy_20260826
  retain: true
  storageClass: local-path
  size: 4Gi

worker:
  serviceAccount: pharness-worker
  # Read-only source identity used by discovery, onboarding validation, and
  # immutable readiness Jobs. Public repositories may leave tokenSecretName
  # blank; private access uses a separately scoped out-of-band Secret.
  sourceReader:
    enabled: true
    serviceAccount: pharness-source-reader
    tokenSecretName: ""
    allowedRepos:
      - https://github.com/lward27/finance_app_database_service.git
      - https://github.com/lward27/finance-frontend.git
      - https://github.com/lward27/lucas_engineering.git
      - https://github.com/lward27/scraper_manager.git
      - https://github.com/lward27/yfinance_wrapper.git
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 3600
  # A dedicated GitHub branch/PR writer. It stays disabled until an operator
  # creates the referenced Secret out-of-band and explicitly allows a repo.
  # The API does not mount this Secret; only the short-lived writer Job does.
  gitWriter:
    enabled: true
    serviceAccount: pharness-git-writer
    tokenSecretName: pharness-git-writer-token
    allowedRepos:
      - https://github.com/lward27/finance_app_database_service.git
      - https://github.com/lward27/finance-frontend.git
      - https://github.com/lward27/scraper_manager.git
      - https://github.com/lward27/yfinance_wrapper.git
    githubApiUrl: https://api.github.com
    authorName: Pharness
    authorEmail: pharness@lucas.engineering
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600
  # GitOps manifests use a separate credential, ServiceAccount, and allowlist
  # from application source changes. It stays disabled until a disposable dev
  # GitOps repository is explicitly approved for a writer smoke.
  gitOpsWriter:
    enabled: false
    serviceAccount: pharness-gitops-writer
    tokenSecretName: ""
    allowedRepos: []
    githubApiUrl: https://api.github.com
    authorName: Pharness
    authorEmail: pharness@localhost
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600
  # A separate read-only GitHub identity used only to inspect the exact PR
  # created by Pharness and persist an immutable merge SHA. This is distinct
  # from the writer token and remains disabled by default.
  gitObserver:
    enabled: true
    serviceAccount: pharness-git-observer
    tokenSecretName: pharness-git-observer-token
    allowedRepos:
      - https://github.com/lward27/finance_app_database_service.git
      - https://github.com/lward27/finance-frontend.git
      - https://github.com/lward27/scraper_manager.git
      - https://github.com/lward27/yfinance_wrapper.git
    githubApiUrl: https://api.github.com
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 3600
  # GitOps PR observation is intentionally a fourth GitHub identity. It must
  # never reuse either the source observer or either writer credential.
  gitOpsObserver:
    enabled: false
    serviceAccount: pharness-gitops-observer
    tokenSecretName: ""
    allowedRepos: []
    githubApiUrl: https://api.github.com
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 3600
  tektonExecutor:
    serviceAccount: pharness-tekton-runner
    pollSeconds: 5
    # The executor cannot dispatch anywhere unless this allowlist is explicit.
    allowedNamespaces:
      - tekton-pipelines
  # The Argo executor remains disabled until the disposable dev delivery path
  # has an approved smoke. When enabled, it may operate only on explicitly
  # named Applications in the configured Argo CD namespace.
  argoExecutor:
    enabled: false
    serviceAccount: pharness-argo-runner
    allowedApplications: []
    pollSeconds: 5
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 3600
  workspaceDir: /workspace
  # Coding workspaces use one durable PVC per run so approved mutations survive
  # the short-lived Job boundary used for each inline approval resume.
  workspaceSizeLimit: 4Gi
  workspaceStorageClass: local-path
  workspaceEphemeralStorageRequest: 2Gi
  workspaceEphemeralStorageLimit: 4Gi
  # Node-local storage is uneven in the homelab. Keep coding workers on the
  # roomier node until a storage-aware scheduler/controller is introduced.
  workspaceNodeHostname: ubuntu-lucas-engineering
  maxConcurrentRunJobs: 1
  # Exact HTTPS repositories permitted for Kubernetes coding workspaces.
  # Read-only onboarding proposer workspaces use this same transport boundary;
  # inclusion here does not grant source-writer or EnvironmentProfile access.
  workspaceAllowedRemoteRepos:
    - https://github.com/lward27/finance_app_database_service.git
    - https://github.com/lward27/finance-frontend.git
    - https://github.com/lward27/scraper_manager.git
    - https://github.com/lward27/yfinance_wrapper.git
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600

# Implementation branches keep the future runner profile inactive until the
# post-merge release commit replaces this immutable historical pin with a
# runner built from the exact merged API/UI revision.
environmentProfiles:
  - id: python-3.11
    active: true
    image: registry.lucas.engineering/pharness-python-runner@sha256:9a36b1b4a8127245a1e5bec3f6ab34a109595ffd245ac63f96137c60fa6111e7
    revision: "54688f09812825eacd2e9e522a96a993f5e154f3"
    platform: linux/amd64
    required_executables:
      - pharness-worker
      - git
      - python
      - pip
    preparation_strategy: python_hashed_requirements
    service_account: pharness-python-runner
    repository_allowlist:
      - https://github.com/lward27/finance_app_database_service.git
      - https://github.com/lward27/scraper_manager.git
      - https://github.com/lward27/yfinance_wrapper.git
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral_storage: 4Gi
  - id: node-24
    active: true
    image: registry.lucas.engineering/pharness-node-runner@sha256:94d9c308da802b30008c9c3fec55165c504286f6c25d984ba0ecee888670c8ec
    revision: "54688f09812825eacd2e9e522a96a993f5e154f3"
    platform: linux/amd64
    required_executables:
      - pharness-worker
      - git
      - node
      - npm
    preparation_strategy: node_npm_ci
    service_account: pharness-node-runner
    repository_allowlist:
      - https://github.com/lward27/finance-frontend.git
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral_storage: 4Gi

# A permanently inert, GitOps-managed Pipeline used only by the bounded
# execution smoke. Keep this enabled only in environments where Tekton is
# installed and the executor namespace below is allowlisted.
tektonE2eSmoke:
  enabled: true
  namespace: tekton-pipelines
  pipelineName: pharness-e2e-noop
  image: docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

# A second inert fixture that proves Tekton result collection and the durable
# digest-pinned pipeline_build_output artifact. It does not build, push, pull,
# inspect, or authenticate to an OCI registry; the result values are fixed
# synthetic provenance markers.
tektonE2eBuildOutputSmoke:
  enabled: true
  namespace: tekton-pipelines
  pipelineName: pharness-e2e-build-output
  image: docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  imageUrl: example.invalid/pharness/e2e-build-output:synthetic
  imageDigest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

ui:
  image:
    repository: registry.lucas.engineering/pharness-ui
    digest: sha256:1ba86a196aea31765df203817597c3a570344c94a93b49febabfb06491dd94e6
    pullPolicy: IfNotPresent
    revision: 54688f09812825eacd2e9e522a96a993f5e154f3
  replicas: 1
  host: pharness.lucas.engineering
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: true
  apiEnabled: false
  className: nginx
  clusterIssuer: letsencrypt-prod
  uiTlsSecretName: pharness-lucas-engineering-tls
  apiTlsSecretName: pharness-api-lucas-engineering-tls
  # htpasswd secret gating the public console; ingress renders only when set.
  basicAuthSecretName: pharness-console-basic-auth

networkPolicy:
  enabled: true
  # Flannel/standard NetworkPolicy cannot select FQDNs. Runner pods therefore
  # have no direct internet egress and use phase-specific CONNECT proxies
  # whose exact host allowlists are server-owned here.
  egressProxy:
    enabled: true
    preparationAllowedHosts:
      - github.com
      - pypi.org
      - files.pythonhosted.org
      - registry.npmjs.org
    codingAllowedHosts:
      - api.fireworks.ai

# The only production target admitted by this milestone. The API compares
# every field with its locked policy tuple; this is not a general allowlist.
protectedProductionTarget:
  enabled: true
  environment: production
  namespace: apps-prod
  argoApplication: yfinance-wrapper
  workloadKind: Deployment
  workloadName: yfinance-wrapper
  sourceRepo: https://github.com/lward27/yfinance_wrapper.git
  gitOpsRepo: https://github.com/lward27/lucas_engineering.git
  kustomizationPath: charts/yfinance-wrapper/kustomization.yaml
  imageName: registry.lucas.engineering/yfinance_wrapper
  rollbackOwner: lucas
