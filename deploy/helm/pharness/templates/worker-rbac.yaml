apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: readonly-observer
{{- if .Values.worker.sourceReader.enabled }}
---
# This identity has no Kubernetes RoleBinding. Its optional GitHub credential
# is mounted only into short-lived deterministic source-reader Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.sourceReader.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: source-reader
{{- end }}
{{- range .Values.environmentProfiles }}
---
# Runner profiles deliberately receive no Kubernetes RoleBinding. Preparation
# and coding Jobs communicate only with the PHarness API and approved FQDNs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .service_account }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: repository-runner
    agentic.lucas.engineering/environment-profile: {{ .id | quote }}
{{- end }}
---
# This identity intentionally has no Kubernetes RoleBinding. Its only scoped
# authority is the GitHub token mounted into a short-lived writer Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.gitWriter.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: git-writer
---
# This identity deliberately has no Kubernetes RoleBinding. It may receive a
# GitHub token only in a short-lived GitOps writer Job, never in the API or a
# model worker.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.gitOpsWriter.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: gitops-writer
---
# This identity deliberately has no Kubernetes RoleBinding. Its separately
# scoped GitHub token can only read PR metadata for exact allowed repos.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.gitObserver.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: git-observer
---
# GitOps observer has a separately scoped repository token and no Kubernetes
# RoleBinding. It can only inspect the exact GitOps pull request.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.gitOpsObserver.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: gitops-observer
---
# Read-only observation permissions for worker attempts, mirroring the
# hermes-readonly-observer posture: no Secret access anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pharness-readonly-observer
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: readonly-observer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - configmaps
      - namespaces
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources:
      - pipelineruns
      - taskruns
      - pipelines
      - tasks
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pharness-worker-readonly-observer
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: readonly-observer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.worker.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pharness-readonly-observer
---
# The executor has no model credentials and no broad ClusterRole. It can create
# PipelineRuns only in the explicit target namespaces below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.tektonExecutor.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: tekton-executor
{{- range .Values.worker.tektonExecutor.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pharness-tekton-runner
  namespace: {{ . }}
  labels:
    app.kubernetes.io/part-of: pharness
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pharness-tekton-runner
  namespace: {{ . }}
  labels:
    app.kubernetes.io/part-of: pharness
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.worker.tektonExecutor.serviceAccount }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pharness-tekton-runner
{{- end }}
{{- if and .Values.worker.argoExecutor.enabled (eq (len .Values.worker.argoExecutor.allowedApplications) 0) }}
{{- fail "worker.argoExecutor.enabled requires at least one exact allowedApplications entry" }}
{{- end }}
{{- if .Values.worker.argoExecutor.enabled }}
---
# This identity can patch only the explicitly named Argo Applications below.
# It has no Secret, Deployment, or generic Kubernetes mutation authority.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.argoExecutor.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
    agentic.lucas.engineering/role: argo-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pharness-argo-runner
  namespace: {{ .Values.api.cluster.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: pharness
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames:
{{- range .Values.worker.argoExecutor.allowedApplications }}
      - {{ . | quote }}
{{- end }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pharness-argo-runner
  namespace: {{ .Values.api.cluster.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: pharness
subjects:
  - kind: ServiceAccount
    name: {{ .Values.worker.argoExecutor.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pharness-argo-runner
{{- end }}
