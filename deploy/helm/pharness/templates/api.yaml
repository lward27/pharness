apiVersion: v1
kind: ServiceAccount
metadata:
  name: pharness-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
---
# The API orchestrates one worker Job per run attempt in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pharness-api-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pharness-api-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
subjects:
  - kind: ServiceAccount
    name: pharness-api
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pharness-api-jobs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharness-api-data
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.api.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharness-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: pharness-api
    app.kubernetes.io/part-of: pharness
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    # SQLite on a PVC: never run two API writers at once.
    type: Recreate
  selector:
    matchLabels:
      app: pharness-api
  template:
    metadata:
      labels:
        app: pharness-api
        app.kubernetes.io/part-of: pharness
    spec:
      serviceAccountName: pharness-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}@{{ .Values.api.image.digest }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 4777
              name: http
          env:
            - name: PHARNESS_BIND
              value: "0.0.0.0:4777"
            - name: PHARNESS_DB_PATH
              value: {{ .Values.api.dbPath | quote }}
            - name: HOME
              value: /tmp
            - name: PHARNESS_WORKER_MODE
              value: kubernetes_job
            - name: PHARNESS_WORKER_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PHARNESS_WORKER_K8S_IMAGE
              value: "{{ .Values.api.image.repository }}@{{ .Values.api.image.digest }}"
            - name: PHARNESS_BUILD_REVISION
              value: {{ .Values.api.image.revision | quote }}
            - name: PHARNESS_RUNTIME_IMAGE_DIGEST
              value: {{ .Values.api.image.digest | quote }}
            - name: PHARNESS_UI_IMAGE_DIGEST
              value: {{ .Values.ui.image.digest | quote }}
            - name: PHARNESS_UI_BUILD_REVISION
              value: {{ .Values.ui.image.revision | quote }}
            - name: PHARNESS_WORKER_K8S_SERVICE_ACCOUNT
              value: {{ .Values.worker.serviceAccount | quote }}
            - name: PHARNESS_TEKTON_EXECUTOR_SERVICE_ACCOUNT
              value: {{ .Values.worker.tektonExecutor.serviceAccount | quote }}
            - name: PHARNESS_TEKTON_ALLOWED_NAMESPACES
              value: {{ join "," .Values.worker.tektonExecutor.allowedNamespaces | quote }}
            - name: PHARNESS_TEKTON_EXECUTOR_POLL_SECONDS
              value: {{ .Values.worker.tektonExecutor.pollSeconds | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_ENABLED
              value: {{ .Values.worker.argoExecutor.enabled | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_SERVICE_ACCOUNT
              value: {{ .Values.worker.argoExecutor.serviceAccount | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_NAMESPACE
              value: {{ .Values.api.cluster.argocdNamespace | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_ALLOWED_APPLICATIONS
              value: {{ join "," .Values.worker.argoExecutor.allowedApplications | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_POLL_SECONDS
              value: {{ .Values.worker.argoExecutor.pollSeconds | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.argoExecutor.activeDeadlineSeconds | quote }}
            - name: PHARNESS_ARGO_EXECUTOR_TTL_SECONDS
              value: {{ .Values.worker.argoExecutor.ttlSecondsAfterFinished | quote }}
            - name: PHARNESS_GIT_WRITER_ENABLED
              value: {{ .Values.worker.gitWriter.enabled | quote }}
            - name: PHARNESS_GIT_WRITER_SERVICE_ACCOUNT
              value: {{ .Values.worker.gitWriter.serviceAccount | quote }}
            - name: PHARNESS_GIT_WRITER_TOKEN_SECRET
              value: {{ .Values.worker.gitWriter.tokenSecretName | quote }}
            - name: PHARNESS_GIT_WRITER_ALLOWED_REPOS
              value: {{ join "," .Values.worker.gitWriter.allowedRepos | quote }}
            - name: PHARNESS_GIT_WRITER_GITHUB_API_URL
              value: {{ .Values.worker.gitWriter.githubApiUrl | quote }}
            - name: PHARNESS_GIT_WRITER_AUTHOR_NAME
              value: {{ .Values.worker.gitWriter.authorName | quote }}
            - name: PHARNESS_GIT_WRITER_AUTHOR_EMAIL
              value: {{ .Values.worker.gitWriter.authorEmail | quote }}
            - name: PHARNESS_GIT_WRITER_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.gitWriter.activeDeadlineSeconds | quote }}
            - name: PHARNESS_GIT_WRITER_TTL_SECONDS
              value: {{ .Values.worker.gitWriter.ttlSecondsAfterFinished | quote }}
            - name: PHARNESS_GITOPS_WRITER_ENABLED
              value: {{ .Values.worker.gitOpsWriter.enabled | quote }}
            - name: PHARNESS_GITOPS_WRITER_SERVICE_ACCOUNT
              value: {{ .Values.worker.gitOpsWriter.serviceAccount | quote }}
            - name: PHARNESS_GITOPS_WRITER_TOKEN_SECRET
              value: {{ .Values.worker.gitOpsWriter.tokenSecretName | quote }}
            - name: PHARNESS_GITOPS_WRITER_ALLOWED_REPOS
              value: {{ join "," .Values.worker.gitOpsWriter.allowedRepos | quote }}
            - name: PHARNESS_GITOPS_WRITER_GITHUB_API_URL
              value: {{ .Values.worker.gitOpsWriter.githubApiUrl | quote }}
            - name: PHARNESS_GITOPS_WRITER_AUTHOR_NAME
              value: {{ .Values.worker.gitOpsWriter.authorName | quote }}
            - name: PHARNESS_GITOPS_WRITER_AUTHOR_EMAIL
              value: {{ .Values.worker.gitOpsWriter.authorEmail | quote }}
            - name: PHARNESS_GITOPS_WRITER_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.gitOpsWriter.activeDeadlineSeconds | quote }}
            - name: PHARNESS_GITOPS_WRITER_TTL_SECONDS
              value: {{ .Values.worker.gitOpsWriter.ttlSecondsAfterFinished | quote }}
            - name: PHARNESS_GIT_OBSERVER_ENABLED
              value: {{ .Values.worker.gitObserver.enabled | quote }}
            - name: PHARNESS_GIT_OBSERVER_SERVICE_ACCOUNT
              value: {{ .Values.worker.gitObserver.serviceAccount | quote }}
            - name: PHARNESS_GIT_OBSERVER_TOKEN_SECRET
              value: {{ .Values.worker.gitObserver.tokenSecretName | quote }}
            - name: PHARNESS_GIT_OBSERVER_ALLOWED_REPOS
              value: {{ join "," .Values.worker.gitObserver.allowedRepos | quote }}
            - name: PHARNESS_GIT_OBSERVER_GITHUB_API_URL
              value: {{ .Values.worker.gitObserver.githubApiUrl | quote }}
            - name: PHARNESS_GIT_OBSERVER_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.gitObserver.activeDeadlineSeconds | quote }}
            - name: PHARNESS_GIT_OBSERVER_TTL_SECONDS
              value: {{ .Values.worker.gitObserver.ttlSecondsAfterFinished | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_ENABLED
              value: {{ .Values.worker.gitOpsObserver.enabled | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_SERVICE_ACCOUNT
              value: {{ .Values.worker.gitOpsObserver.serviceAccount | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_TOKEN_SECRET
              value: {{ .Values.worker.gitOpsObserver.tokenSecretName | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_ALLOWED_REPOS
              value: {{ join "," .Values.worker.gitOpsObserver.allowedRepos | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_GITHUB_API_URL
              value: {{ .Values.worker.gitOpsObserver.githubApiUrl | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.gitOpsObserver.activeDeadlineSeconds | quote }}
            - name: PHARNESS_GITOPS_OBSERVER_TTL_SECONDS
              value: {{ .Values.worker.gitOpsObserver.ttlSecondsAfterFinished | quote }}
            - name: PHARNESS_WORKER_K8S_API_URL
              value: "http://pharness-api.{{ .Release.Namespace }}.svc.cluster.local:4777"
            - name: PHARNESS_WORKER_K8S_WORKSPACE_DIR
              value: {{ .Values.worker.workspaceDir | quote }}
            - name: PHARNESS_WORKER_K8S_WORKSPACE_SIZE_LIMIT
              value: {{ .Values.worker.workspaceSizeLimit | quote }}
            - name: PHARNESS_WORKER_K8S_WORKSPACE_EPHEMERAL_STORAGE_REQUEST
              value: {{ .Values.worker.workspaceEphemeralStorageRequest | quote }}
            - name: PHARNESS_WORKER_K8S_WORKSPACE_EPHEMERAL_STORAGE_LIMIT
              value: {{ .Values.worker.workspaceEphemeralStorageLimit | quote }}
            - name: PHARNESS_WORKER_K8S_WORKSPACE_NODE_HOSTNAME
              value: {{ .Values.worker.workspaceNodeHostname | quote }}
            - name: PHARNESS_WORKER_K8S_MAX_CONCURRENT_RUN_JOBS
              value: {{ .Values.worker.maxConcurrentRunJobs | quote }}
            - name: PHARNESS_WORKSPACE_ALLOWED_REMOTE_REPOS
              value: {{ join "," .Values.worker.workspaceAllowedRemoteRepos | quote }}
            - name: PHARNESS_WORKER_K8S_FIREWORKS_SECRET
              value: {{ .Values.api.fireworksSecretName | quote }}
            - name: PHARNESS_WORKER_K8S_TOKEN_SECRET
              value: {{ .Values.api.workerTokenSecretName | quote }}
            - name: PHARNESS_WORKER_K8S_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.activeDeadlineSeconds | quote }}
            - name: PHARNESS_WORKER_K8S_TTL_SECONDS
              value: {{ .Values.worker.ttlSecondsAfterFinished | quote }}
            - name: PHARNESS_FIREWORKS_MODEL
              value: {{ .Values.api.model | quote }}
            - name: PHARNESS_ARGOCD_NAMESPACE
              value: {{ .Values.api.cluster.argocdNamespace | quote }}
            - name: PHARNESS_PROMETHEUS_URL
              value: {{ .Values.api.cluster.prometheusUrl | quote }}
            - name: PHARNESS_LOKI_URL
              value: {{ .Values.api.cluster.lokiUrl | quote }}
            - name: PHARNESS_REGISTRY_ALIASES
              value: {{ .Values.api.cluster.registryAliases | quote }}
            - name: PHARNESS_POLICY_SUBJECT
              value: {{ .Values.api.policy.subject | quote }}
            - name: PHARNESS_POLICY_ENVIRONMENT
              value: {{ .Values.api.policy.environment | quote }}
            - name: PHARNESS_PROTECTED_TARGET_ENABLED
              value: {{ .Values.protectedProductionTarget.enabled | quote }}
            - name: PHARNESS_PROTECTED_TARGET_ENVIRONMENT
              value: {{ .Values.protectedProductionTarget.environment | quote }}
            - name: PHARNESS_PROTECTED_TARGET_NAMESPACE
              value: {{ .Values.protectedProductionTarget.namespace | quote }}
            - name: PHARNESS_PROTECTED_TARGET_ARGO_APPLICATION
              value: {{ .Values.protectedProductionTarget.argoApplication | quote }}
            - name: PHARNESS_PROTECTED_TARGET_WORKLOAD_KIND
              value: {{ .Values.protectedProductionTarget.workloadKind | quote }}
            - name: PHARNESS_PROTECTED_TARGET_WORKLOAD_NAME
              value: {{ .Values.protectedProductionTarget.workloadName | quote }}
            - name: PHARNESS_PROTECTED_TARGET_SOURCE_REPO
              value: {{ .Values.protectedProductionTarget.sourceRepo | quote }}
            - name: PHARNESS_PROTECTED_TARGET_GITOPS_REPO
              value: {{ .Values.protectedProductionTarget.gitOpsRepo | quote }}
            - name: PHARNESS_PROTECTED_TARGET_KUSTOMIZATION_PATH
              value: {{ .Values.protectedProductionTarget.kustomizationPath | quote }}
            - name: PHARNESS_PROTECTED_TARGET_IMAGE_NAME
              value: {{ .Values.protectedProductionTarget.imageName | quote }}
            - name: PHARNESS_PROTECTED_TARGET_ROLLBACK_OWNER
              value: {{ .Values.protectedProductionTarget.rollbackOwner | quote }}
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.fireworksSecretName }}
                  key: api-key
            - name: PHARNESS_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.workerTokenSecretName }}
                  key: token
            - name: PHARNESS_OPERATOR_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.operatorTokenSecretName }}
                  key: tokens
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pharness-api-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pharness-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: pharness-api
    app.kubernetes.io/part-of: pharness
spec:
  selector:
    app: pharness-api
  ports:
    - name: http
      port: 4777
      targetPort: http
