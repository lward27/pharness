spec:
  podSelector:
    matchLabels:
      app: pharness-inference-evaluator
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-model-gateway
      ports:
        - { protocol: TCP, port: 4780 }
{{- end }}
{{- if .Values.worker.sourceReader.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-source-reader-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-source-reader
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: preparation
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-onboarding-proposer-source-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: coding
      agentic.lucas.engineering/onboarding-proposer: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: preparation
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-egress-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-egress-proxy
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        # Keep the runner source namespace explicit. The K3s network-policy
        # controller used by the protected cluster did not admit matching
        # same-namespace Pods when this relied on the implicit namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: pharness-runner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: pharness-source-reader
        {{- if .Values.inferenceGateway.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: pharness-model-gateway
        {{- end }}
        {{- if .Values.inferenceGateway.directFireworksEnabled }}
        # The matched rollback-transport evaluation uses the direct client but
        # still exits only through the coding CONNECT proxy. Keep this class
        # separate from gateway evaluators so it cannot reach the gateway or
        # inherit normal runner authorization.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: pharness-direct-inference-evaluator
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
