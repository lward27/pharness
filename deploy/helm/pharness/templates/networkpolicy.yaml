{{- if .Values.networkPolicy.enabled }}
# The API accepts traffic only from inside its namespace (operator console
# proxy and worker attempts) and from the ingress controller when exposed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
spec:
  podSelector:
    matchLabels:
      app: pharness-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4777
    {{- if and .Values.ingress.enabled .Values.ingress.apiEnabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4777
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
spec:
  podSelector:
    matchLabels:
      app: pharness-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egressProxy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-runner-preparation-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: preparation
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: preparation
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-runner-coding-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: coding
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: coding
      ports:
        - { protocol: TCP, port: 8080 }
{{- if .Values.worker.sourceReader.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-source-reader-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-source-reader
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: preparation
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-onboarding-proposer-source-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: coding
      agentic.lucas.engineering/onboarding-proposer: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: preparation
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-egress-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-egress-proxy
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        # Keep the runner source namespace explicit. The K3s network-policy
        # controller used by the protected cluster did not admit matching
        # same-namespace Pods when this relied on the implicit namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: pharness-runner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: pharness-source-reader
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
