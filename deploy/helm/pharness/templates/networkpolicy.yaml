{{- if .Values.networkPolicy.enabled }}
# The API accepts traffic only from inside its namespace (operator console
# proxy and worker attempts) and from the ingress controller when exposed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
spec:
  podSelector:
    matchLabels:
      app: pharness-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4777
    {{- if and .Values.ingress.enabled .Values.ingress.apiEnabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4777
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
spec:
  podSelector:
    matchLabels:
      app: pharness-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egressProxy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-runner-preparation-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: preparation
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: preparation
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-runner-coding-egress-direct-fireworks
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: coding
      agentic.lucas.engineering/inference-mode: direct-fireworks
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: coding
      ports:
        - { protocol: TCP, port: 8080 }
{{- if .Values.inferenceGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-runner-coding-egress-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-runner
      agentic.lucas.engineering/phase: coding
      agentic.lucas.engineering/inference-mode: gateway
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-api
      ports:
        - { protocol: TCP, port: 4777 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-model-gateway
      ports:
        - { protocol: TCP, port: 4780 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharness-model-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pharness-model-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pharness-api
        - podSelector:
            matchLabels:
              app: pharness-runner
              agentic.lucas.engineering/inference-mode: gateway
        - podSelector:
            matchLabels:
              app: pharness-inference-evaluator
      ports:
        - { protocol: TCP, port: 4780 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: pharness-egress-proxy
              agentic.lucas.engineering/phase: coding
      ports:
        - { protocol: TCP, port: 8080 }
    {{- $inferenceRegistry := .Files.Get "files/inference-registry.json" | fromJson }}
    {{- range $target := $inferenceRegistry.targets }}
    {{- if and $target.selectable $target.transport.allow_insecure_private_http $target.transport.private_cidr $target.transport.private_port }}
    - to:
        - ipBlock:
            cidr: {{ $target.transport.private_cidr | quote }}
      ports:
        - { protocol: TCP, port: {{ $target.transport.private_port }} }
    {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.inferenceGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
