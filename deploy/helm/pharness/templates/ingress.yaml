{{- if and .Values.ingress.enabled .Values.ingress.basicAuthSecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharness-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    cert-manager.io/private-key-rotation-policy: "Never"
    cert-manager.io/revision-history-limit: "2147483647"
    # The console injects the operator bearer server-side, so the public
    # surface must carry its own authentication.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-pharness-console-basic-auth@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ui.host }}
      secretName: {{ .Values.ingress.uiTlsSecretName }}
  rules:
    - host: {{ .Values.ui.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pharness-ui
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pharness-console-basic-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
spec:
  basicAuth:
    # Traefik reads htpasswd lines from the Secret's data, including the
    # `auth` key used by the original ingress-nginx Secret.
    secret: {{ .Values.ingress.basicAuthSecretName }}
    realm: Pharness Console
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.agentHostApi.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharness-agent-host-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    cert-manager.io/private-key-rotation-policy: "Never"
    cert-manager.io/revision-history-limit: "2147483647"
    # The host protocol already requires an enrollment or host/lease bearer
    # credential. This exact prefix must not inherit console Basic Auth because
    # HTTP carries only one Authorization header.
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.agentHostApi.host }}
      secretName: {{ .Values.ingress.agentHostApi.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.agentHostApi.host }}
      http:
        paths:
          - path: /api/internal/agent-hosts
            pathType: Prefix
            backend:
              service:
                name: pharness-api
                port:
                  name: http
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.apiEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharness-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: pharness
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    cert-manager.io/private-key-rotation-policy: "Never"
    cert-manager.io/revision-history-limit: "2147483647"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.api.host }}
      secretName: {{ .Values.ingress.apiTlsSecretName }}
  rules:
    - host: {{ .Values.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pharness-api
                port:
                  name: http
{{- end }}
