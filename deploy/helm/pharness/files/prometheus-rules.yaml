groups:
  - name: pharness-control-plane
    rules:
      - alert: PharnessApiDown
        # Keyed on an exported series rather than `up{job=...}` so the rule
        # holds for both ServiceMonitor and annotation-based discovery.
        expr: absent(pharness_build_info)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: pharness-api metrics endpoint is not being scraped
          description: No pharness_build_info series has been scraped for 5 minutes (series go stale 5 minutes after the last successful scrape).
      - alert: PharnessControllerStalled
        # The hosted loop ticks every 15s. A stale tick with the controller
        # enabled means claims and waits are no longer being observed.
        expr: pharness_controller_enabled == 1 and pharness_controller_last_tick_age_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: hosted controller loop has not ticked for over 2 minutes
          description: pharness_controller_last_tick_age_seconds is {{ $value | humanizeDuration }}.
      - alert: PharnessControllerReconcileErrors
        expr: increase(pharness_controller_reconcile_errors_total[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: hosted reconciliation passes are failing
          description: More than three reconciliation passes failed in the last 15 minutes.
      - alert: PharnessHostedWorkBlocked
        expr: pharness_hosted_reconciliations{condition="blocked"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: hosted WorkItems have been blocked for 30 minutes
          description: '{{ $value }} open hosted WorkItems carry condition=blocked; inspect their controller reasons.'
      - alert: PharnessHostedWaitExpired
        expr: pharness_hosted_reconciliations{condition="wait_expired"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: a hosted WorkItem exhausted its wait budget
          description: '{{ $value }} hosted WorkItems have condition=wait_expired and need an operator decision.'
      - alert: PharnessHostedReconciliationBacklog
        # Due work that stays unclaimed for several loop intervals means the
        # controller is wedged or saturated.
        expr: pharness_hosted_reconciliations_oldest_due_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: due hosted reconciliations are not being claimed
          description: The oldest due reconciliation has waited {{ $value | humanizeDuration }}.
      - alert: PharnessHostedOperationStuck
        expr: pharness_hosted_operations_oldest_active_age_seconds > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: a hosted operation has been active for over 2 hours
          description: The oldest unfinished hosted operation is {{ $value | humanizeDuration }} old.
  - name: pharness-storage
    rules:
      - alert: PharnessSqliteDatabaseLarge
        # The default claim is 2Gi; alert well before SQLite can no longer
        # checkpoint its WAL.
        expr: pharness_sqlite_database_bytes > 1.5 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SQLite database is approaching its claim size
          description: pharness_sqlite_database_bytes is {{ $value | humanize1024 }}B.
      - alert: PharnessBackupJobFailed
        expr: kube_job_status_failed{job_name=~"pharness-backup-.*"} > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: a scheduled SQLite backup Job failed
          description: Job {{ $labels.job_name }} in {{ $labels.namespace }} reported failure.
      - alert: PharnessBackupMissing
        expr: time() - max(kube_job_status_completion_time{job_name=~"pharness-backup-.*"}) > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: no SQLite backup Job has completed in 36 hours
          description: The nightly backup CronJob has not produced a successful archive recently.
  - name: pharness-campus
    rules:
      - alert: PharnessCampusCleanupBlocked
        # A teardown that cannot be confirmed (unreachable node or storage,
        # a finalizer that does not clear) holds its slot. The controller
        # never force-deletes or strips finalizers, so this needs an operator.
        expr: pharness_campus_lab_slots{condition="cleanup_blocked"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: a Campus lab session cleanup is blocked
          description: '{{ $value }} lab slots of tenant {{ $labels.tenant }} hold a session whose teardown is not confirmed; see planning/operations/campus-teardown.md.'
      - alert: PharnessCampusSlotQuarantined
        # Orphans are deleted after a 60 s grace; a slot that stays
        # quarantined means the janitor cannot remove what it found.
        expr: pharness_campus_lab_slots{condition="quarantined"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: a Campus lab slot is quarantined by the orphan janitor
          description: '{{ $value }} lab slots of tenant {{ $labels.tenant }} hold workloads no live session owns.'
      - alert: PharnessCampusQuarantineAging
        expr: pharness_campus_lab_oldest_quarantine_age_seconds > 3600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: a Campus lab slot has been out of service for over an hour
          description: The oldest blocked or quarantined slot of tenant {{ $labels.tenant }} is {{ $value | humanizeDuration }} old.
      - alert: PharnessCampusExpiredSessionsLive
        # The reconciler revokes expired sessions on its next pass, every
        # few seconds; anything older means expiry is not being enforced.
        expr: pharness_campus_lab_sessions_expired_live > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Campus lab sessions are live past their absolute expiry
          description: '{{ $value }} sessions of tenant {{ $labels.tenant }} are past expires_at and neither terminal nor quarantined.'
      - alert: PharnessCampusJanitorStalled
        # The janitor passes every 30 s once a provider is configured; the
        # timestamp stays 0 in a process without one.
        expr: pharness_campus_lab_janitor_last_pass_timestamp_seconds > 0 and time() - pharness_campus_lab_janitor_last_pass_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: the Campus lab orphan janitor has not completed a pass for 5 minutes
          description: The last janitor pass finished {{ $value | humanizeDuration }} ago.
      - alert: PharnessCampusJanitorErrors
        expr: increase(pharness_campus_lab_janitor_errors_total[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Campus lab janitor passes are failing
          description: More than three janitor inventory, delete or journal errors in the last 15 minutes.
