# Generated by driver.py render; driver.py is the source of truth.
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "l114-bench-gvisor-example"
  namespace: "campus-lab-spike"
  labels:
    pharness.dev/spike: "luc-114"
    pharness.dev/runtime: "gvisor"
    pharness.dev/test: "bench"
spec:
  restartPolicy: "Never"
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 2
  nodeSelector:
    kubernetes.io/hostname: "ubuntu-lucas-engineering-2"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    - name: "lab"
      image: "registry.lucas.engineering/pharness-python-runner@sha256:0dcdb9e74355d55c634e6adaf9643b4466557aa728130e752408d62baf2f9756"
      imagePullPolicy: "IfNotPresent"
      command:
        - "/bin/sh"
        - "-c"
        - |
          # Shared helpers prepended by driver.py to every shell workload.
          set -u
          export HOME="${HOME:-/workspace/home}"
          mkdir -p "$HOME"

          now() { date +%s.%N; }

          # phase NAME CMD... runs CMD with output captured to a per-phase log, then
          # prints a machine-readable timing line and the tail of the log.
          phase() {
            _name=$1
            shift
            _start=$(now)
            "$@" >"/workspace/phase-$_name.log" 2>&1
            _rc=$?
            _end=$(now)
            echo "@@PHASE name=$_name rc=$_rc start=$_start end=$_end"
            tail -n "${TAIL_LINES:-20}" "/workspace/phase-$_name.log" | sed "s/^/[$_name] /"
            return "$_rc"
          }

          # A depth-1 fetch of one exact commit keeps the clone reproducible without
          # depending on branch or tag names.
          clone_at_sha() {
            git init -q /workspace/repo &&
              cd /workspace/repo &&
              git remote add origin "$LAB_REPO" &&
              git fetch -q --depth 1 origin "$LAB_SHA" &&
              git -c advice.detachedHead=false checkout -q FETCH_HEAD
          }

          # runc exposes the container's cgroup v2 files. gVisor exposes its own
          # emulated cgroup v1 hierarchy, which accounts for the sandboxed workload only
          # (not the Sentry and Gofer host processes).
          cgroup_report() {
            for _f in memory.peak memory.current memory.max cpu.stat cpu.max \
              memory/memory.max_usage_in_bytes memory/memory.usage_in_bytes memory/memory.limit_in_bytes \
              cpuacct/cpuacct.usage; do
              if [ -r "/sys/fs/cgroup/$_f" ]; then
                echo "@@CGROUP $_f $(tr '\n' ' ' <"/sys/fs/cgroup/$_f")"
              else
                echo "@@CGROUP $_f unavailable"
              fi
            done
          }

          echo "@@START epoch=$(now) kernel=$(uname -r)"

          # CPU, syscall, process and file-I/O micro-benchmarks (python runner image).
          cat >/tmp/files.py <<'PYEOF'
          import os
          import sys

          root = "/workspace/files"
          count = 10000
          mode = sys.argv[1]
          if mode == "create":
              os.makedirs(root, exist_ok=True)
              for i in range(count):
                  with open(f"{root}/f{i:05d}", "wb") as handle:
                      handle.write(b"x" * 128)
          elif mode == "stat":
              total = 0
              for i in range(count):
                  total += os.stat(f"{root}/f{i:05d}").st_size
              print(len(os.listdir(root)), total)
          elif mode == "delete":
              for i in range(count):
                  os.unlink(f"{root}/f{i:05d}")
          PYEOF
          phase cpu_python_loop python3 -c 'print(sum(i * i for i in range(20000000)))'
          phase sha256_1gib_zero sh -c 'head -c 1073741824 /dev/zero | sha256sum'
          phase syscall_getppid_1m python3 -c 'import os
          for _ in range(1000000):
              os.getppid()'
          phase fork_exec_true_1k sh -c 'i=0; while [ "$i" -lt 1000 ]; do /bin/true; i=$((i + 1)); done'
          phase python_startup_20 sh -c 'i=0; while [ "$i" -lt 20 ]; do python3 -c pass; i=$((i + 1)); done'
          phase files_create_10k python3 /tmp/files.py create
          phase files_stat_10k python3 /tmp/files.py stat
          phase files_delete_10k python3 /tmp/files.py delete
          phase dd_write_512mib_fsync dd if=/dev/zero of=/workspace/dd.bin bs=1M count=512 conv=fsync
          phase dd_read_512mib dd if=/workspace/dd.bin of=/dev/null bs=1M
          rm -f /workspace/dd.bin
          cgroup_report
      workingDir: "/workspace"
      env:
        - name: "HOME"
          value: "/workspace/home"
      resources:
        requests:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "4Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "4Gi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - "ALL"
        seccompProfile:
          type: "RuntimeDefault"
      volumeMounts:
        - name: "workspace"
          mountPath: "/workspace"
        - name: "tmp"
          mountPath: "/tmp"
  volumes:
    - name: "workspace"
      emptyDir:
        sizeLimit: "3Gi"
    - name: "tmp"
      emptyDir:
        sizeLimit: "1Gi"
  runtimeClassName: "gvisor"
