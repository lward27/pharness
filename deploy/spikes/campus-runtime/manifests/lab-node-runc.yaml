# Generated by driver.py render; driver.py is the source of truth.
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "l114-lab-node-runc-example"
  namespace: "campus-lab-spike"
  labels:
    pharness.dev/spike: "luc-114"
    pharness.dev/runtime: "runc"
    pharness.dev/test: "lab-node"
spec:
  restartPolicy: "Never"
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 2
  nodeSelector:
    kubernetes.io/hostname: "ubuntu-lucas-engineering-2"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    - name: "lab"
      image: "registry.lucas.engineering/pharness-node-runner@sha256:c478a31d341af1d1c7a13a99236120c870d0b88d1a9b80ac59159dd1a145a7bd"
      imagePullPolicy: "IfNotPresent"
      command:
        - "/bin/sh"
        - "-c"
        - |
          # Shared helpers prepended by driver.py to every shell workload.
          set -u
          export HOME="${HOME:-/workspace/home}"
          mkdir -p "$HOME"

          now() { date +%s.%N; }

          # phase NAME CMD... runs CMD with output captured to a per-phase log, then
          # prints a machine-readable timing line and the tail of the log.
          phase() {
            _name=$1
            shift
            _start=$(now)
            "$@" >"/workspace/phase-$_name.log" 2>&1
            _rc=$?
            _end=$(now)
            echo "@@PHASE name=$_name rc=$_rc start=$_start end=$_end"
            tail -n "${TAIL_LINES:-20}" "/workspace/phase-$_name.log" | sed "s/^/[$_name] /"
            return "$_rc"
          }

          # A depth-1 fetch of one exact commit keeps the clone reproducible without
          # depending on branch or tag names.
          clone_at_sha() {
            git init -q /workspace/repo &&
              cd /workspace/repo &&
              git remote add origin "$LAB_REPO" &&
              git fetch -q --depth 1 origin "$LAB_SHA" &&
              git -c advice.detachedHead=false checkout -q FETCH_HEAD
          }

          # runc exposes the container's cgroup v2 files. gVisor exposes its own
          # emulated cgroup v1 hierarchy, which accounts for the sandboxed workload only
          # (not the Sentry and Gofer host processes).
          cgroup_report() {
            for _f in memory.peak memory.current memory.max cpu.stat cpu.max \
              memory/memory.max_usage_in_bytes memory/memory.usage_in_bytes memory/memory.limit_in_bytes \
              cpuacct/cpuacct.usage; do
              if [ -r "/sys/fs/cgroup/$_f" ]; then
                echo "@@CGROUP $_f $(tr '\n' ' ' <"/sys/fs/cgroup/$_f")"
              else
                echo "@@CGROUP $_f unavailable"
              fi
            done
          }

          echo "@@START epoch=$(now) kernel=$(uname -r)"

          # Node lab: pinned clone, npm ci, npm test.
          phase clone clone_at_sha || { cgroup_report; exit 10; }
          cd /workspace/repo || exit 10
          echo "@@REVISION $(git rev-parse HEAD)"
          phase install npm ci --no-audit --no-fund || { cgroup_report; exit 12; }
          TAIL_LINES=15
          phase test npm test
          rc=$?
          cgroup_report
          exit "$rc"
      workingDir: "/workspace"
      env:
        - name: "HOME"
          value: "/workspace/home"
        - name: "LAB_REPO"
          value: "https://github.com/uuidjs/uuid"
        - name: "LAB_SHA"
          value: "3d1eba06be81fb3a02e16d06ef6fe959c9bb5c5c"
      resources:
        requests:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "4Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "4Gi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - "ALL"
        seccompProfile:
          type: "RuntimeDefault"
      volumeMounts:
        - name: "workspace"
          mountPath: "/workspace"
        - name: "tmp"
          mountPath: "/tmp"
  volumes:
    - name: "workspace"
      emptyDir:
        sizeLimit: "3Gi"
    - name: "tmp"
      emptyDir:
        sizeLimit: "1Gi"
