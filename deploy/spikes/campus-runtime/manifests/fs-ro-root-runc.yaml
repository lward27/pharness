# Generated by driver.py render; driver.py is the source of truth.
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "l114-fs-ro-root-runc-example"
  namespace: "campus-lab-spike"
  labels:
    pharness.dev/spike: "luc-114"
    pharness.dev/runtime: "runc"
spec:
  restartPolicy: "Never"
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 2
  nodeSelector:
    kubernetes.io/hostname: "ubuntu-lucas-engineering-2"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    - name: "lab"
      image: "registry.lucas.engineering/pharness-python-runner@sha256:0dcdb9e74355d55c634e6adaf9643b4466557aa728130e752408d62baf2f9756"
      imagePullPolicy: "IfNotPresent"
      command:
        - "/bin/sh"
        - "-c"
        - "mkdir -p \"$HOME\"; python3 -c \"$LUC114_SCRIPT\"; rc=$?; echo \"@@EXIT rc=$rc\"; if [ -n \"${LUC114_HOLD:-}\" ]; then sleep \"$LUC114_HOLD\"; fi; exit \"$rc\""
      workingDir: "/workspace"
      env:
        - name: "HOME"
          value: "/workspace/home"
        - name: "LUC114_SCRIPT"
          value: |
            """Filesystem, permission, PTY and inotify behaviour checks run inside a lab pod.

            Each result is one line: "@@CHECK {json}" with status ok, fail or info.
            """
            import ctypes
            import errno
            import fcntl
            import json
            import mmap
            import multiprocessing
            import os
            import pty
            import select
            import shutil
            import socket
            import stat
            import struct
            import subprocess
            import sys
            import termios
            import time
            import tty

            EXPECT_RO = os.environ.get("LUC114_EXPECT_RO", "1") == "1"
            WS = "/workspace/fscheck"
            TMP = "/tmp/fscheck"


            def emit(name, status, detail=""):
                print("@@CHECK " + json.dumps({"name": name, "status": status, "detail": str(detail)[:700]}), flush=True)


            def ename(exc):
                if isinstance(exc, OSError) and exc.errno:
                    return errno.errorcode.get(exc.errno, str(exc.errno))
                return type(exc).__name__


            def check(name, fn):
                try:
                    result = fn()
                    emit(name, "ok", "" if result is None else result)
                except Exception as exc:  # noqa: BLE001 - every failure is a finding
                    emit(name, "fail", f"{ename(exc)}: {exc}")


            def check_denied(name, fn, accepted):
                try:
                    fn()
                    emit(name, "fail", "unexpectedly succeeded")
                except OSError as exc:
                    code = ename(exc)
                    emit(name, "ok" if code in accepted else "fail", f"{code}: {exc.strerror}")


            def info(name, fn):
                try:
                    emit(name, "info", fn())
                except Exception as exc:  # noqa: BLE001
                    emit(name, "info", f"{ename(exc)}: {exc}")


            def mounts():
                wanted = {"/", "/tmp", "/workspace", "/dev/shm", "/proc", "/sys", "/dev", "/sys/fs/cgroup", "/etc/hosts"}
                found = {}
                with open("/proc/mounts") as handle:
                    for line in handle:
                        dev, point, fstype, opts = line.split()[:4]
                        if point in wanted:
                            found[point] = f"{dev} {fstype} {opts}"
                return found


            def write_file(path, size=1 << 20):
                data = os.urandom(size)
                with open(path, "wb") as handle:
                    handle.write(data)
                    handle.flush()
                    os.fsync(handle.fileno())
                with open(path, "rb") as handle:
                    if handle.read() != data:
                        raise AssertionError("readback mismatch")
                return f"{size} bytes written, fsynced and verified"


            def owner(path):
                st = os.stat(path)
                return f"uid={st.st_uid} gid={st.st_gid} mode={oct(stat.S_IMODE(st.st_mode))}"


            def chmod_checks():
                path = WS + "/perm"
                with open(path, "w") as handle:
                    handle.write("secret")
                os.chmod(path, 0o600)
                mode = stat.S_IMODE(os.stat(path).st_mode)
                if mode != 0o600:
                    raise AssertionError(oct(mode))
                os.chmod(path, 0)
                try:
                    open(path).read()
                    raise AssertionError("read of a mode 0000 file succeeded")
                except PermissionError:
                    pass
                os.chmod(path, 0o644)
                return "0600 applied; mode 0000 denied read with EACCES; restored"


            def umask_check():
                old = os.umask(0o027)
                path = WS + "/umask"
                open(path, "w").close()
                os.umask(old)
                mode = stat.S_IMODE(os.stat(path).st_mode)
                if mode != 0o640:
                    raise AssertionError(oct(mode))
                return "umask 027 produced 0640"


            def gid_inherit():
                path = WS + "/gidfile"
                open(path, "w").close()
                return f"new file gid={os.stat(path).st_gid}; process gid={os.getgid()} groups={os.getgroups()}"


            def exec_from(directory):
                path = directory + "/hello.sh"
                with open(path, "w") as handle:
                    handle.write("#!/bin/sh\necho exec-ok\n")
                os.chmod(path, 0o755)
                out = subprocess.run([path], capture_output=True, text=True, timeout=10)
                if out.stdout.strip() != "exec-ok":
                    raise AssertionError(out)
                return "script executed"


            def symlinks():
                d = WS + "/links"
                os.makedirs(d)
                with open(d + "/target.txt", "w") as handle:
                    handle.write("payload")
                os.symlink("target.txt", d + "/rel")
                assert os.readlink(d + "/rel") == "target.txt"
                assert open(d + "/rel").read() == "payload"
                assert stat.S_ISLNK(os.lstat(d + "/rel").st_mode)
                os.symlink(d + "/missing", d + "/dangling")
                assert os.path.lexists(d + "/dangling") and not os.path.exists(d + "/dangling")
                os.symlink("/etc/hostname", d + "/abs")
                open(d + "/abs").read()
                os.symlink(d, d + "/dirlink")
                assert os.path.isdir(d + "/dirlink")
                os.symlink("loop2", d + "/loop1")
                os.symlink("loop1", d + "/loop2")
                try:
                    open(d + "/loop1")
                    raise AssertionError("symlink loop resolved")
                except OSError as exc:
                    assert exc.errno == errno.ELOOP, exc
                os.link(d + "/target.txt", d + "/hard")
                assert os.stat(d + "/target.txt").st_nlink == 2
                return "relative, absolute, directory, dangling, loop (ELOOP) and hardlink (nlink=2) correct"


            def cross_volume_symlink():
                with open(TMP + "/x", "w") as handle:
                    handle.write("cross")
                os.symlink(TMP + "/x", WS + "/cross")
                return open(WS + "/cross").read()


            def rename_exdev():
                with open(TMP + "/mv", "w") as handle:
                    handle.write("m")
                try:
                    os.rename(TMP + "/mv", WS + "/mv")
                    result = "os.rename across volumes succeeded"
                except OSError as exc:
                    result = f"os.rename across volumes -> {ename(exc)}"
                    shutil.move(TMP + "/mv", WS + "/mv")
                    result += "; shutil.move succeeded"
                return result


            def rename_atomic():
                a, b = WS + "/a", WS + "/b"
                with open(a, "w") as handle:
                    handle.write("new")
                with open(b, "w") as handle:
                    handle.write("old")
                os.replace(a, b)
                assert open(b).read() == "new" and not os.path.exists(a)
                return "os.replace over an existing file is atomic"


            def locks():
                path = WS + "/lock"
                fd = os.open(path, os.O_RDWR | os.O_CREAT, 0o644)
                fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                probe = (
                    "import fcntl, os\n"
                    f"fd = os.open({path!r}, os.O_RDWR)\n"
                    "res = []\n"
                    "for fn in (fcntl.flock, fcntl.lockf):\n"
                    "    try:\n"
                    "        fn(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)\n"
                    "        res.append('acquired')\n"
                    "    except OSError:\n"
                    "        res.append('blocked')\n"
                    "print(' '.join(res))\n"
                )
                fcntl.lockf(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                out = subprocess.run([sys.executable, "-c", probe], capture_output=True, text=True, timeout=10).stdout.strip()
                os.close(fd)
                if out != "blocked blocked":
                    raise AssertionError(f"second process: {out}")
                return "flock and POSIX locks exclude a second process"


            def mmap_check():
                path = WS + "/mmap"
                with open(path, "wb") as handle:
                    handle.write(b"\0" * 4096)
                with open(path, "r+b") as handle:
                    mapped = mmap.mmap(handle.fileno(), 4096)
                    mapped[:5] = b"hello"
                    mapped.flush()
                    mapped.close()
                assert open(path, "rb").read(5) == b"hello"
                return "shared mapping write visible through read()"


            def xattr_check():
                path = WS + "/xattr"
                open(path, "w").close()
                os.setxattr(path, "user.luc114", b"1")
                return f"user xattr round-trip {os.getxattr(path, 'user.luc114')!r}"


            def fallocate_check():
                fd = os.open(WS + "/falloc", os.O_RDWR | os.O_CREAT, 0o644)
                os.posix_fallocate(fd, 0, 16 << 20)
                size = os.fstat(fd).st_size
                os.close(fd)
                return f"posix_fallocate 16 MiB -> size {size}"


            def sparse_check():
                path = WS + "/sparse"
                with open(path, "wb") as handle:
                    handle.truncate(1 << 30)
                st = os.stat(path)
                return f"1 GiB truncate: size={st.st_size} allocated={st.st_blocks * 512}"


            def odirect_check():
                fd = os.open(WS + "/direct", os.O_WRONLY | os.O_CREAT | os.O_DIRECT, 0o644)
                os.close(fd)
                return "O_DIRECT open accepted"


            def unix_socket():
                path = TMP + "/sock"
                server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                server.bind(path)
                server.listen(1)
                client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                client.connect(path)
                conn, _ = server.accept()
                client.sendall(b"ping")
                data = conn.recv(4)
                for s in (client, conn, server):
                    s.close()
                assert data == b"ping"
                return "AF_UNIX stream socket on /tmp works"


            IN_MODIFY, IN_CLOSE_WRITE, IN_CREATE, IN_DELETE = 0x2, 0x8, 0x100, 0x200
            MASK_NAMES = {IN_MODIFY: "MODIFY", IN_CLOSE_WRITE: "CLOSE_WRITE", IN_CREATE: "CREATE", IN_DELETE: "DELETE"}


            def inotify_check():
                libc = ctypes.CDLL(None, use_errno=True)
                fd = libc.inotify_init1(os.O_NONBLOCK | os.O_CLOEXEC)
                if fd < 0:
                    raise OSError(ctypes.get_errno(), "inotify_init1")
                d = WS + "/watch"
                os.makedirs(d)
                wd = libc.inotify_add_watch(fd, d.encode(), IN_CREATE | IN_MODIFY | IN_CLOSE_WRITE | IN_DELETE)
                if wd < 0:
                    raise OSError(ctypes.get_errno(), "inotify_add_watch")
                with open(d + "/f", "w") as handle:
                    handle.write("x")
                os.unlink(d + "/f")
                seen = []
                deadline = time.time() + 3
                while time.time() < deadline and len(seen) < 4:
                    ready, _, _ = select.select([fd], [], [], 0.5)
                    if not ready:
                        continue
                    buf = os.read(fd, 4096)
                    offset = 0
                    while offset < len(buf):
                        _, mask, _, length = struct.unpack_from("iIII", buf, offset)
                        offset += 16 + length
                        seen.append("|".join(n for m, n in MASK_NAMES.items() if mask & m) or hex(mask))
                os.close(fd)
                if not seen:
                    raise AssertionError("no inotify events delivered")
                limits = open("/proc/sys/fs/inotify/max_user_watches").read().strip() if os.path.exists("/proc/sys/fs/inotify/max_user_watches") else "n/a"
                return f"events={seen} max_user_watches={limits}"


            def pty_fork_check():
                pid, master = pty.fork()
                if pid == 0:
                    fcntl.ioctl(0, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 120, 0, 0))
                    os.execvp("sh", ["sh", "-c", "tty; stty size; echo pty-ok"])
                out = b""
                while True:
                    try:
                        chunk = os.read(master, 1024)
                    except OSError:
                        break
                    if not chunk:
                        break
                    out += chunk
                os.waitpid(pid, 0)
                text = out.decode(errors="replace")
                if "pty-ok" not in text or "/dev/pts/" not in text or "40 120" not in text:
                    raise AssertionError(text)
                return text.strip().replace("\r\n", " | ")


            def pty_termios():
                master, slave = os.openpty()
                name = os.ttyname(slave)
                attrs = termios.tcgetattr(slave)
                tty.setraw(slave)
                termios.tcsetattr(slave, termios.TCSANOW, attrs)
                os.write(slave, b"ping\n")
                data = os.read(master, 100)
                return f"openpty {name}, isatty={os.isatty(slave)}, raw/restore ok, echo {data!r}"


            def script_check():
                if not shutil.which("script"):
                    return "script(1) not installed in image"
                out = subprocess.run(["script", "-qc", "tty", "/dev/null"], capture_output=True, text=True, timeout=10)
                return f"rc={out.returncode} {out.stdout.strip()!r}"


            def shm_check():
                ctx = multiprocessing.get_context("fork")
                queue = ctx.Queue()
                proc = ctx.Process(target=queue.put, args=("mp-ok",))
                proc.start()
                value = queue.get(timeout=10)
                proc.join(10)
                return f"{value}; /dev/shm free={shutil.disk_usage('/dev/shm').free}"


            def many_procs():
                procs = [subprocess.Popen(["/bin/true"]) for _ in range(64)]
                codes = [p.wait(timeout=30) for p in procs]
                if any(codes):
                    raise AssertionError(codes)
                return "64 concurrent child processes exited 0"


            def timestamps():
                path = WS + "/ts"
                open(path, "w").close()
                os.utime(path, ns=(1_700_000_000_123_456_789, 1_700_000_000_123_456_789))
                return f"mtime_ns readback {os.stat(path).st_mtime_ns}"


            emit("identity", "info", f"uid={os.getuid()} gid={os.getgid()} groups={os.getgroups()} HOME={os.environ.get('HOME')}")
            info("mounts", mounts)
            os.makedirs(WS, exist_ok=True)
            os.makedirs(TMP, exist_ok=True)
            os.makedirs(os.environ.get("HOME", "/workspace/home"), exist_ok=True)

            if EXPECT_RO:
                for target in ("/luc114-probe", "/var/tmp/luc114-probe", "/etc/luc114-probe", "/usr/local/luc114-probe"):
                    check_denied(
                        f"ro_root_create:{target}",
                        lambda t=target: os.close(os.open(t, os.O_WRONLY | os.O_CREAT, 0o644)),
                        {"EROFS", "EACCES"},
                    )
            else:
                check("rw_root_write:/var/tmp", lambda: write_file("/var/tmp/luc114-probe"))

            check("write_workspace_emptydir", lambda: write_file(WS + "/blob"))
            check("write_tmp", lambda: write_file(TMP + "/blob"))
            check("write_home", lambda: write_file(os.environ["HOME"] + "/blob"))
            info("owner:/workspace", lambda: owner("/workspace"))
            info("owner:/tmp", lambda: owner("/tmp"))
            check("chmod_and_mode_enforcement", chmod_checks)
            check("umask", umask_check)
            info("fsgroup_inheritance", gid_inherit)
            check("exec_from_workspace", lambda: exec_from(WS))
            check("exec_from_tmp", lambda: exec_from(TMP))
            check("symlinks_and_hardlinks", symlinks)
            check("symlink_across_volumes", cross_volume_symlink)
            info("rename_across_volumes", rename_exdev)
            check("rename_atomic", rename_atomic)
            check("file_locks", locks)
            check("mmap_shared", mmap_check)
            info("xattr_user", xattr_check)
            check("posix_fallocate", fallocate_check)
            info("sparse_file", sparse_check)
            info("o_direct", odirect_check)
            check("unix_socket", unix_socket)
            check("inotify", inotify_check)
            check("pty_fork", pty_fork_check)
            check("pty_termios", pty_termios)
            info("script_cmd", script_check)
            check("multiprocessing_dev_shm", shm_check)
            check("concurrent_processes", many_procs)
            info("timestamps_ns", timestamps)
            info("statvfs", lambda: {p: shutil.disk_usage(p)._asdict() for p in ("/workspace", "/tmp", "/")})
            info("proc_self", lambda: f"exe={os.readlink('/proc/self/exe')} fds={len(os.listdir('/proc/self/fd'))}")
            print("@@DONE", flush=True)
        - name: "LUC114_EXPECT_RO"
          value: "1"
        - name: "LUC114_HOLD"
          value: "600"
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "2Gi"
        limits:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "2Gi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - "ALL"
        seccompProfile:
          type: "RuntimeDefault"
      volumeMounts:
        - name: "workspace"
          mountPath: "/workspace"
        - name: "tmp"
          mountPath: "/tmp"
  volumes:
    - name: "workspace"
      emptyDir:
        sizeLimit: "3Gi"
    - name: "tmp"
      emptyDir:
        sizeLimit: "1Gi"
