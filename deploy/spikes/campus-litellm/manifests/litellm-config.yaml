# Deterministic prices match harness/fake_upstream.py. Gateway retries, router retries, cooldowns
# and fallbacks are all off (ADR: disable gateway retries initially).
model_list:
  - model_name: campus-small
    litellm_params:
      model: openai/fake-small
      api_base: http://fake-upstream:8080/v1
      api_key: fake-upstream-does-not-check
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      max_retries: 0
      timeout: 8
      stream_timeout: 8
    model_info:
      max_input_tokens: 4000
      max_output_tokens: 200
  - model_name: campus-large
    litellm_params:
      model: openai/fake-large
      api_base: http://fake-upstream:8080/v1
      api_key: fake-upstream-does-not-check
      input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
      max_retries: 0
      timeout: 8
      stream_timeout: 8
    model_info:
      max_input_tokens: 4000
      max_output_tokens: 200
  - model_name: campus-unpriced
    litellm_params:
      model: openai/fake-unpriced
      api_base: http://fake-upstream:8080/v1
      api_key: fake-upstream-does-not-check
      max_retries: 0
      timeout: 8
      stream_timeout: 8

litellm_settings:
  num_retries: 0
  request_timeout: 8
  drop_params: true

router_settings:
  num_retries: 0
  retry_after: 0
  disable_cooldowns: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  coordination_redis:
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
  fail_closed_budget_enforcement: true
  apply_user_budget_to_team_keys: true
  proxy_batch_write_at: 5
  proxy_budget_rescheduler_min_time: 15
  proxy_budget_rescheduler_max_time: 20
